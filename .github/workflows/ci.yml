name: Backend CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.0
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: hiking_alone
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h localhost -uroot -proot"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      # 按顺序手动建库建表：ddl.sql 必须在 data.sql 之前执行
      - name: Init database
        run: |
          sudo apt-get update
          sudo apt-get install -y default-mysql-client
          mysql --host=127.0.0.1 --user=root --password=root hiking_alone < sql/ddl.sql
          mysql --host=127.0.0.1 --user=root --password=root hiking_alone < sql/data.sql

      # SpringBootTest 启动完整上下文需要真实数据库；-D 命令行参数优先级高于 application-dev.yml
      - name: Build and test
        run: |
          chmod +x ./mvnw
          ./mvnw -B verify \
            -Dspring.datasource.url='jdbc:mysql://127.0.0.1:3306/hiking_alone?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true' \
            -Dspring.datasource.username=root \
            -Dspring.datasource.password=root

      - name: Upload jar
        uses: actions/upload-artifact@v4
        with:
          name: hikingalone-jar
          path: target/*.jar

  deploy:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: hikingalone-jar
          path: jar

      - name: Upload jar to server
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "jar/*.jar"
          target: "/tmp/hikingalone/"
          # scp-action 用 tar 保留 source 目录结构；strip_components: 1 去掉 jar/ 层，jar 直接落在 /tmp/hikingalone/
          strip_components: 1

      # 同步建表脚本并执行：create table if not exists 幂等，保证服务器库结构跟随代码演进
      # （data.sql 不重复执行，避免种子数据重复插入）
      - name: Upload DDL
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "sql/ddl.sql"
          target: "/tmp/hikingalone/"
          # 同上：去掉 sql/ 层，文件直接落在 /tmp/hikingalone/ddl.sql
          strip_components: 1

      - name: Apply database schema
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            ls -la /tmp/hikingalone/
            test -f /tmp/hikingalone/ddl.sql || { echo "ddl.sql not uploaded"; exit 1; }
            mysql -uroot -proot hiking_alone < /tmp/hikingalone/ddl.sql

      - name: Deploy and restart
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: ${{ secrets.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            ls -la /tmp/hikingalone/
            sudo mv /tmp/hikingalone/*.jar /opt/hikingalone/app.jar
            sudo systemctl restart hikingalone
            sleep 8
            # 自检：jar 替换后后端应能响应 /home
            curl -s -o /dev/null -w "backend /home -> %{http_code}\n" http://127.0.0.1:8080/home || echo "WARN: backend not responding yet"
