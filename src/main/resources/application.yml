spring:
  profiles:
    active: dev
  docker:
    compose:
      enabled: false
  mail:
    host: smtp.qq.com
    port: 465
    username: 1962008499@qq.com
    password: ${MAIL_PASSWORD:}   # QQ 邮箱 SMTP 授权码（非登录密码），建议用环境变量注入
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true          # 465 = 隐式 SSL（QQ 官方推荐）；587/STARTTLS 在部分云厂商被墙，故用 465


register:
  code:
    expire: 300 # 验证码有效期 300s
    cool: 60    # 同一邮箱发送冷却 60s（防刷）


server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true
