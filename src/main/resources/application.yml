spring:
  profiles:
    active: dev
  docker:
    compose:
      enabled: false
  mail:
    host: smtp.qq.com
    port: 465
    username: 1962008499@qq.com
    password: ${MAIL_PASSWORD:}   # QQ 邮箱 SMTP 授权码（非登录密码），建议用环境变量注入
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true          # 465 = 隐式 SSL（QQ 官方推荐）；587/STARTTLS 在部分云厂商被墙，故用 465


register:
  code:
    expire: 300 # 验证码有效期 300s
    cool: 60    # 同一邮箱发送冷却 60s（防刷）

# ========== LLM（AI 装备建议，OpenAI 兼容协议：DeepSeek/通义千问/智谱/自建 vLLM 均可） ==========
# api-key 未配置时 AI 建议自动降级为内置规则引擎，功能可用但无个性化
llm:
  base-url: ${LLM_BASE_URL:https://api.deepseek.com}
  api-key: ${LLM_API_KEY:}      # 各平台控制台申请，注入环境变量，勿提交明文
  model: ${LLM_MODEL:deepseek-chat}
  timeout-seconds: 30


server:
  port: 8080
  servlet:
    context-path: /
    # 会话不活动 30 分钟过期（Tomcat 默认值，显式声明成文档）：过期后受保护接口由
    # LoginUserInterceptor 统一返回 401，前端 request.ts 跳 /login?expired=1 并提示重新登录
    session:
      timeout: 30m
    encoding:
      charset: UTF-8
      enabled: true
      force: true
