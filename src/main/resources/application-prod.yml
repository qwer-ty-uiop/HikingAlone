# ========== 生产环境配置（服务器 systemd 以 --spring.profiles.active=prod 启动） ==========
# 与 deploy.md 保持一致：数据库 root/root、本机 3306
spring:
  application:
    name: HikingAlone

  # ========== 数据库连接配置（启动必填） ==========
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://127.0.0.1:3306/hiking_alone?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai&useSSL=false&allowPublicKeyRetrieval=true
    username: root
    password: root
    hikari:
      minimum-idle: 5
      maximum-pool-size: 20
      connection-timeout: 30000
      idle-timeout: 60000

  # ========== Redis（邮箱验证码存储，生产必配） ==========
  data:
    redis:
      host: 127.0.0.1
      port: 6379

  # ========== 邮件发送（验证码） ==========
  mail:
    host: smtp.qq.com
    port: 465
    username: 1962008499@qq.com
    password: ${MAIL_PASSWORD:}   # QQ 邮箱 SMTP 授权码（非登录密码），用环境变量注入
    properties:
      mail:
        smtp:
          auth: true
          ssl:
            enable: true          # 465 = 隐式 SSL（QQ 官方推荐）；587/STARTTLS 在部分云厂商被墙，故用 465

server:
  port: 8080
  servlet:
    context-path: /
    encoding:
      charset: UTF-8
      enabled: true
      force: true

# ========= MyBatis-Plus 配置 =========
mybatis-plus:
  mapper-locations: classpath:mapper/**/*.xml
  type-aliases-package: com.ty.hikingalone.infrastructure
  configuration:
    map-underscore-to-camel-case: true
  global-config:
    db-config:
      id-type: auto
      table-underline: true

# ========== SpringDoc 接口文档 ==========
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
  group-configs:
    - group: 'default'
      paths-to-match: '/**'
      packages-to-scan: com.ty.hikingalone.controller

# ========== 日志配置 ==========
logging:
  level:
    com.ty.hikingalone: info
    org.springframework.web: info
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{50} - %msg%n"
